!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    .card {
      padding: 48px 56px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #e0e0e0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 24px;
      letter-spacing: 1px;
      color: #1e3c72;
    }

    p {
      font-size: 1.3rem;
      margin: 8px 0;
    }

    .label { color: #666; }
    .value { font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p><span class="label">Name:</span> <span class="value">KAVI PRAGATHI SP</span></p>
    <p><span class="label">Register Number:</span> <span class="value">26010384</span></p>
  </div>
</body>
</html>
